name: Deploy to Dev Server

on:
  push:
    branches:
      - main # Ganti dengan branch dev Anda jika bukan main (misal: development / staging)
  workflow_dispatch: # Memungkinkan trigger manual lewat tombol 'Run workflow' di GitHub

jobs:
  deploy:
    name: Deploy & Refresh Database
    runs-on: self-hosted # Dijalankan langsung oleh server dev Anda

    steps:
      - name: Deploy new code & Rebuild Docker
        run: |
          echo "🚀 Menjalankan deployment di server development..."
          
          # Masuk ke folder proyek andalas-residence di server
          cd /home/docker/andalas-residence
          
          # Fix permission storage agar git tidak permission denied saat reset
          docker run --rm -v "$(pwd)/storage:/storage" alpine chown -R $(id -u):$(id -g) /storage 2>/dev/null || true

          # 1. Update kode terbaru dari git
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}

          # 2. Build ulang container dengan image terbaru
          docker compose up -d --build --remove-orphans

          # 3. Tunggu container aplikasi running dan siap
          echo "⏳ Menunggu container andalas-app siap..."
          docker compose exec -T andalas-app php artisan wait:db 2>/dev/null || sleep 5

          # Step awal mengubah owner storage ke user runner host untuk git reset.
          # Pulihkan owner agar PHP-FPM (www-data) dapat menulis compiled Blade.
          docker compose exec -T -u root andalas-app sh -lc 'chown -R www-data:www-data storage bootstrap/cache && chmod -R 775 storage bootstrap/cache'

          # bootstrap/cache berada di named volume, jadi cache route lama tetap bertahan saat image dibangun ulang.
          # Bersihkan cache route sebelum seeder membuat URL dokumen verifikasi.
          docker compose exec -T andalas-app php artisan route:clear

          # 4. Reset database dan jalankan seeder baru
          # Validasi sumber master sebelum database direset.
          docker compose exec -T andalas-app php artisan asrama:seed-master --dry-run --no-interaction
          echo "🔄 Mereset database dan menjalankan seeder..."
          # DatabaseSeeder memanggil ResidenceMasterSeeder untuk Data Asrama.xlsx, lalu seeder demo dev.
          docker compose exec -T andalas-app php artisan migrate:fresh --seed --seeder=DatabaseSeeder --force --no-interaction

          # 5. Bersihkan cache aplikasi
          docker compose exec -T andalas-app php artisan optimize:clear
          docker compose exec -T andalas-app php artisan config:cache
          docker compose exec -T andalas-app php artisan route:cache
          docker compose exec -T andalas-app php artisan view:cache

          # Migrate dan seeder berjalan sebagai root; pulihkan izin runtime setelah cache/file demo dibuat.
          docker compose exec -T -u root andalas-app sh -lc 'chown -R www-data:www-data storage bootstrap/cache && chmod -R 775 storage bootstrap/cache'

          echo "✅ Deployment selesai! Kode, database, dan seeder sudah diperbarui."
