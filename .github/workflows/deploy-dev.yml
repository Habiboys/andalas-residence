name: Deploy to Dev Server

on:
  push:
    branches:
      - main # Ganti dengan branch dev Anda jika bukan main (misal: development / staging)
  workflow_dispatch:
    inputs:
      database_mode:
        description: 'Database: migrate mempertahankan data; fresh-seed MENGHAPUS SEMUA DATA lalu seed ulang'
        required: true
        type: choice
        default: migrate
        options:
          - migrate
          - fresh-seed

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy & Migrate Database
    runs-on: self-hosted # Dijalankan langsung oleh server dev Anda

    steps:
      - name: Deploy new code & Rebuild Docker
        shell: bash
        env:
          DATABASE_MODE: ${{ inputs.database_mode || 'migrate' }}
          DEPLOY_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "🚀 Menjalankan deployment di server development..."
          
          # Masuk ke folder proyek andalas-residence di server
          cd /home/docker/andalas-residence
          
          # Fix permission storage agar git tidak permission denied saat reset
          docker run --rm -v "$(pwd)/storage:/storage" alpine chown -R $(id -u):$(id -g) /storage 2>/dev/null || true

          # 1. Update kode terbaru dari git
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}

          # 2. Build ulang container dengan image terbaru
          docker compose up -d --build --remove-orphans

          # 3. Tunggu container aplikasi running dan siap
          echo "⏳ Menunggu container andalas-app siap..."
          database_ready=false
          for attempt in $(seq 1 30); do
            if docker compose exec -T andalas-app php artisan migrate:status --no-interaction > /dev/null 2>&1; then
              database_ready=true
              break
            fi
            sleep 2
          done
          if [ "$database_ready" != true ]; then
            echo "::error::Database belum siap setelah 60 detik. Deployment dihentikan."
            exit 1
          fi

          # Step awal mengubah owner storage ke user runner host untuk git reset.
          # Pulihkan owner agar PHP-FPM (www-data) dapat menulis compiled Blade.
          docker compose exec -T -u root andalas-app sh -lc 'chown -R www-data:www-data storage bootstrap/cache && chmod -R 775 storage bootstrap/cache'

          # bootstrap/cache berada di named volume, jadi cache route lama tetap bertahan saat image dibangun ulang.
          # Bersihkan cache route lama sebelum migrasi dan cache ulang.
          docker compose exec -T andalas-app php artisan route:clear

          # 4. Push selalu memakai migrate; reset hanya tersedia lewat Run workflow.
          case "$DATABASE_MODE" in
            migrate)
              echo "Menjalankan migrasi tanpa menghapus data..."
              docker compose exec -T andalas-app php artisan migrate --force --no-interaction
              ;;
            fresh-seed)
              if [ "$DEPLOY_EVENT" != "workflow_dispatch" ]; then
                echo "::error::Reset database hanya boleh dipilih melalui Run workflow."
                exit 1
              fi
              echo "Menghapus semua tabel, menjalankan migrasi dari awal, dan mengisi seeder..."
              # DatabaseSeeder memuat akun contoh dan dibatasi ke local/testing.
              # Override ini hanya untuk proses CLI reset di server development.
              docker compose exec -T andalas-app php artisan config:clear
              docker compose exec -T -e APP_ENV=local andalas-app php artisan migrate:fresh --seed --force --no-interaction
              ;;
            *)
              echo "::error::Mode database tidak dikenal: $DATABASE_MODE"
              exit 1
              ;;
          esac

          # 5. Bersihkan cache aplikasi
          docker compose exec -T andalas-app php artisan optimize:clear
          docker compose exec -T andalas-app php artisan config:cache
          docker compose exec -T andalas-app php artisan route:cache
          docker compose exec -T andalas-app php artisan view:cache

          # Pulihkan izin runtime setelah migrasi dan cache dibuat.
          docker compose exec -T -u root andalas-app sh -lc 'chown -R www-data:www-data storage bootstrap/cache && chmod -R 775 storage bootstrap/cache'

          # Workers must reload the final cached configuration after migrations.
          docker compose exec -T andalas-app supervisorctl restart queue-worker:* scheduler

          application_ready=false
          for attempt in $(seq 1 30); do
            if docker compose exec -T andalas-app curl --fail --silent --output /dev/null http://127.0.0.1/up; then
              application_ready=true
              break
            fi
            sleep 2
          done
          if [ "$application_ready" != true ]; then
            echo "::error::Health check aplikasi gagal setelah deployment."
            exit 1
          fi

          # Prints readiness only; never print environment values or client secrets.
          docker compose exec -T andalas-app php artisan tinker --execute='echo app(\App\Services\UnandSso::class)->isConfigured() ? "SSO configuration: ready" : "SSO configuration: incomplete";'
          docker compose exec -T andalas-app php artisan route:list --name=sso --except-vendor
          echo "✅ Deployment selesai! Kode, database, cache dan health check berhasil."
