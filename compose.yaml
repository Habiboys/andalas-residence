services:
  andalas-app:
    container_name: andalas-app
    image: ${DOCKER_IMAGE:-andalas-residence:latest}
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_URL: ${APP_URL:?Isi APP_URL di .env termasuk port atau domain publik aplikasi}
    ports:
      - "${APP_PORT:-8003}:80"
    environment:
      APP_URL: ${APP_URL:?Isi APP_URL di .env}
      # Container aplikasi saja; MySQL dijalankan di host/server terpisah.
      DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
    volumes:
      - ./storage:/var/www/html/storage
      - andalas_bootstrap_cache:/var/www/html/bootstrap/cache
      - type: bind
        source: ./.env
        target: /var/www/html/.env
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - andalas_network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  andalas_network:
    driver: bridge

volumes:
  andalas_bootstrap_cache:
